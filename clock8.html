<html>
	<head>
		<meta charset='utf-8'>
		<title>8-bit clock</title>
		<style>
		</style>
	</head>
	<body>
		<div id='clock8'>
			<!-- hours -->
        		<img id='h1' src='images/0.png'>
        		<img id='h2' src='images/0.png'>

        		<!-- colon separator -->
        		<img id='colon1' src='images/colon.png'>

        		<!-- minutes -->
        		<img id='m1' src='images/0.png'>
        		<img id='m2' src='images/0.png'>

        		<!-- colon separator -->
       			<img id='colon2' src='images/colon.png'>

        		<!-- seconds -->
        		<img id='s1' src='images/0.png'>
        		<img id='s2' src='images/0.png'>
		</div>
		<script>
			/**
			 * Gets the current time and displays it as images.
			 */
			const getTime = () => {
				const now = new Date();
				let hours = now.getHours();
				let minutes = now.getMinutes();
				let seconds = now.getSeconds();

				// add 0 to start of single digit numbers
				hours = String(hours).padStart(2, '0');
				minutes = String(minutes).padStart(2, '0');
				seconds = String(seconds).padStart(2, '0');

				// update images
				document.getElementById('h1').src = `images/${hours[0]}.png`;
				document.getElementById('h2').src = `images/${hours[1]}.png`;
				document.getElementById('m1').src = `images/${minutes[0]}.png`;
				document.getElementById('m2').src = `images/${minutes[1]}.png`;
				document.getElementById('s1').src = `images/${seconds[0]}.png`;
				document.getElementById('s2').src = `images/${seconds[1]}.png`;
			};
			getTime();
			setInterval(getTime, 1000);
		</script>	
	</body>
</html>
